[package]
name = "cipherleaf"
version = "0.1.0"
description = "Cipherleaf - portable encrypted notes and password vault"
authors = ["Mohamed Sayed"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cipherleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# App shell
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
window-vibrancy = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

# Cryptography (RustCrypto, pure Rust)
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "parallel", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
sha1 = "0.11.0"
getrandom = "0.4"
zeroize = { version = "1.9.1", features = ["derive"] }
unicode-normalization = "0.1.26"

# Storage and features
rusqlite = { version = "0.40.2", features = ["bundled"] }
hex = "0.4.3"
csv = "1.4.0"
zxcvbn = "3.1.1"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
# Only used for the opt-in breach check; uses Windows' built-in TLS (SChannel).
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
] }
eff-wordlist = "1.0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
