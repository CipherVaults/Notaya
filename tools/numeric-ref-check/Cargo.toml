[package]
name = "numeric-ref-check"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# Same dependency set and resolved versions as tools/db-bench.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
zeroize = { version = "1.9.1", features = ["derive"] }
hex = "0.4.3"

[[bin]]
name = "numeric-ref-check"
path = "rust_adapter.rs"
